<!DOCTYPE html>
<html>
<head>
  <title>Veterinary Book Library</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      transition: 0.3s;
    }

    body.dark {
      background: #121212;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .toggle {
      cursor: pointer;
      padding: 8px 12px;
      background: white;
      border-radius: 20px;
      font-size: 0.9rem;
      color: black;
    }

    .search-box {
      text-align: center;
      margin: 20px;
    }

    .search-box input {
      width: 300px;
      padding: 10px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: 0.3s;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .title {
      font-weight: bold;
      margin: 10px 0;
    }

    .viewer {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<header>
  📚 Veterinary Library
  <div class="toggle" onclick="toggleMode()">🌙 Toggle</div>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Search books..." onkeyup="filterBooks()">
</div>

<div class="grid" id="bookList">

  <div class="card" onclick="openBook('https://saravananEditions.github.io/BookStore/Trends%20and%20Challenges%20in%20Veterinary%20Profession.pdf')">
    📘 <div class="title">Trends & Challenges</div>
  </div>

  <div class="card" onclick="openBook('https://saravananEditions.github.io/BookStore/Sheep%20Farming%20-%20Volume%20I.pdf')">
    🐑 <div class="title">Sheep Farming Vol I</div>
  </div>

  <div class="card" onclick="openBook('https://saravananEditions.github.io/BookStore/Sheep%20Farming%20-%20Volume%20II.pdf')">
    🐑 <div class="title">Sheep Farming Vol II</div>
  </div>

</div>

<iframe id="viewer" class="viewer"></iframe>

<script>
  function openBook(url) {
    document.getElementById("viewer").src = url;
    window.scrollTo({ top: 600, behavior: 'smooth' });
  }

  function toggleMode() {
    document.body.classList.toggle("dark");
  }

  function filterBooks() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
      let text = card.innerText.toLowerCase();
      card.style.display = text.includes(input) ? "block" : "none";
    });
  }
</script>

</body>
</html>
